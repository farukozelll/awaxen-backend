name: Deploy to Production

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # BUILD & TEST
  # ============================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run linting
        run: |
          ruff check src/ --output-format=github
          ruff format src/ --check

      - name: Run type checking
        run: mypy src/

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/awaxen_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci
          AUTH0_DOMAIN: test.auth0.com
          AUTH0_AUDIENCE: https://test-api
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # DEPLOY TO PRODUCTION
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            # Create backup directory
            sudo mkdir -p /opt/awaxen/backup/$(date +%Y%m%d_%H%M%S)
            
            # Backup current docker-compose.yml
            if [ -f /opt/awaxen/docker-compose.yml ]; then
              sudo cp /opt/awaxen/docker-compose.yml /opt/awaxen/backup/$(date +%Y%m%d_%H%M%S)/
            fi
            
            # Pull latest code (for docker-compose.prod.yml)
            cd /opt/awaxen
            sudo git pull origin main
            
            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Copy production compose file
            sudo cp docker-compose.prod.yml docker-compose.yml
            
            # Pull new images
            sudo docker compose pull
            
            # Run database migrations (if needed)
            sudo docker compose run --rm migrate
            
            # Restart services with zero downtime
            sudo docker compose up -d --remove-orphans
            
            # Wait for health checks
            sleep 30
            
            # Check service health
            sudo docker compose ps
            
            # Clean up old images
            sudo docker image prune -f
            
            # Show logs for verification
            sudo docker compose logs --tail=50 backend

      - name: Health check
        run: |
          sleep 60
          curl -f https://${{ secrets.PROD_DOMAIN }}/health || exit 1

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "Production deployment ${{ job.status }} - Commit: ${{ github.sha }}"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ============================================
  # DEPLOY TO STAGING
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/awaxen-staging
            sudo git pull origin develop
            echo ${{ secrets.GITHUB_TOKEN }} | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo cp docker-compose.prod.yml docker-compose.yml
            sudo docker compose pull
            sudo docker compose run --rm migrate
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f
